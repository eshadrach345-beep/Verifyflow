<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#131921"><link rel="stylesheet" href="/styles.css"><style>
.auth-email-page{min-height:70vh;background:#f5f7fa;padding:60px 18px}
.auth-email-card{max-width:520px;margin:0 auto;background:#fff;border:1px solid #e3e8ee;border-radius:14px;padding:30px;box-shadow:0 12px 40px #1720330d}
.auth-email-card h1{font:800 26px Manrope,Arial;margin:0 0 10px;color:#172033}
.auth-email-card p{font-size:14px;line-height:1.7;color:#667286}
.auth-email-card form{display:grid;gap:14px;margin-top:22px}
.auth-email-card label{font-size:13px;font-weight:700}
.auth-email-card input{height:46px;width:100%;border:1px solid #cbd3db;border-radius:7px;padding:0 12px;font:14px Inter,Arial}
.auth-email-card button{min-height:46px;border:0;border-radius:24px;background:#d7fa72;color:#172033;font-weight:800;cursor:pointer;padding:0 20px}
.auth-email-card button:disabled{opacity:.65;cursor:wait}
.auth-email-message{min-height:24px;margin:12px 0 0!important}
.auth-email-card a{color:#386d78;font-weight:700}
</style><title>Choose a new password — VerifyFlow</title>  <link rel="stylesheet" href="/premium.css">
</head><body><header class="site-header"><a class="brand" href="/"><span class="brand-symbol">V</span><span>verify<span class="brand-light">flow</span></span></a><a class="header-action" href="/account.html">Back to account</a></header><main class="auth-email-page"><section class="auth-email-card"><h1>Choose a new password</h1><p>Use at least 10 characters. Other active sessions will be signed out after this change.</p><form id="reset-password-form"><div><label for="new-password">New password</label><input id="new-password" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128"></div><div><label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="10" maxlength="128"></div><button type="submit">Update password</button></form><p class="auth-email-message" id="reset-message" role="status" aria-live="polite"></p><p><a href="/account.html">Return to sign in</a></p></section></main><script src="/auth-email-pages.js" defer></script></body></html>
